<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lokali Taxi · Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;font-family:Onest,Inter,system-ui,sans-serif;color:#f4f4f2}body[data-theme=light]{color:#202024}.demo{min-height:660px;padding:24px clamp(14px,3vw,38px);display:grid;grid-template-columns:minmax(220px,330px) minmax(250px,1fr);gap:clamp(22px,5vw,64px);align-items:center;justify-content:center}.device-wrap{display:flex;justify-content:center}.device{width:min(100%,280px);padding:8px;border-radius:42px;background:#09090b;border:1px solid #444;box-shadow:0 24px 70px #0006}.screen{width:100%;aspect-ratio:375/812;border-radius:34px;overflow:hidden;background:#eee;position:relative}.screen img{display:block;width:100%;height:100%;object-fit:cover}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:84px;height:23px;border-radius:18px;background:#08080a;pointer-events:none}.panel{max-width:460px}.kicker{font-size:12px;color:#aaa;margin:0 0 12px}h1{font-size:clamp(25px,3.2vw,38px);line-height:1.12;letter-spacing:-.035em;margin:0 0 14px;font-weight:600}.lead{font-size:15px;line-height:1.6;color:#aaa;margin:0 0 22px}.label{font-size:12px;color:#aaa;margin:0 0 10px}.choices{display:grid;gap:8px}.choice{width:100%;border:1px solid #ffffff20;border-radius:13px;background:#ffffff0c;color:inherit;text-align:left;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:inherit;cursor:pointer;transition:border-color .18s,background .18s,transform .18s}.choice:hover{border-color:#ffc40099;transform:translateY(-1px)}.choice[aria-pressed=true]{border-color:#ffc400;background:#ffc40018}.choice b{display:block;font-size:14px;font-weight:550}.choice small{display:block;font-size:12px;color:#aaa;margin-top:3px}.dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:#16a765}.choice[data-state=low] .dot{background:#e39a37}.choice[data-state=demand] .dot{background:#e37c25}.why{margin-top:14px;width:100%;border:0;border-radius:13px;background:#ffc400;color:#171717;padding:14px 16px;font:600 14px inherit;cursor:pointer;min-height:48px}.why:disabled{opacity:.45;cursor:default}.note{font-size:11px;line-height:1.5;color:#999;margin:13px 0 0}@media(max-width:680px){.demo{grid-template-columns:1fr;gap:20px;padding:18px 14px 26px;min-height:0}.device{width:min(64vw,260px)}.panel{max-width:none}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="demo"><div class="device-wrap"><div class="device"><div class="screen"><img id="screen" src="../assets/img/taxi/prototype-good.png" alt="Lokali Taxi — хорошая цена"><span class="island"></span></div></div></div><section class="panel" aria-live="polite"><p class="kicker">Живой прототип · реальные состояния Figma</p><h1 id="title">Цена влияет на отклик водителей</h1><p class="lead" id="desc">Выберите состояние и посмотрите, как приложение объясняет связь между предложенной ценой и поиском машины.</p><p class="label">Состояния заказа</p><div class="choices" role="group" aria-label="Состояния цены"><button class="choice" data-state="good" aria-pressed="true"><span><b>Хорошая цена</b><small>230 ₽ · водители откликнутся быстрее</small></span><i class="dot"></i></button><button class="choice" data-state="low" aria-pressed="false"><span><b>Низкая цена</b><small>180 ₽ · ждать дольше, рекомендовано 230 ₽</small></span><i class="dot"></i></button><button class="choice" data-state="demand" aria-pressed="false"><span><b>Высокий спрос</b><small>270 ₽ · рекомендованная цена выросла</small></span><i class="dot"></i></button></div><button class="why" id="why">Почему цена выросла?</button><p class="note" id="note">Переключаются реальные состояния из макета. Заказ и поиск водителя не подключены.</p></section></main>
<script>
(()=>{try{document.body.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){}try{if(localStorage.getItem('lang')==='en')document.documentElement.lang='en'}catch(e){}const en=document.documentElement.lang==='en',img=document.querySelector('#screen'),title=document.querySelector('#title'),desc=document.querySelector('#desc'),note=document.querySelector('#note'),why=document.querySelector('#why'),buttons=[...document.querySelectorAll('[data-state]')];const states={good:{file:'prototype-good.png',alt:'Good fare, 230 rubles',ru:['Цена влияет на отклик водителей','При цене 230 ₽ приложение показывает статус «Хорошая цена» и сообщает, что водители откликнутся быстрее.','Это состояние «Хорошая цена» из макета Figma.'],en:['The fare affects driver response','At 230 ₽ the app marks the fare as good and says drivers should respond faster.','This is the good-fare state from the Figma design.']},low:{file:'prototype-low.png',alt:'Low fare, 180 rubles',ru:['Низкая цена может увеличить ожидание','При цене 180 ₽ приложение предупреждает, что ожидание может быть дольше, и показывает рекомендацию 230 ₽.','Это состояние «Низкая цена» из макета Figma.'],en:['A lower fare can mean a longer wait','At 180 ₽ the app warns that the passenger may wait longer and recommends 230 ₽.','This is the low-fare state from the Figma design.']},demand:{file:'prototype-demand.png',alt:'High demand, recommended fare 270 rubles',ru:['При высоком спросе цена растёт','Приложение показывает высокий спрос и сообщает, что рекомендованная цена выросла до 270 ₽.','Откройте пояснение, чтобы увидеть причину изменения.'],en:['The recommended fare rises with demand','The app shows high demand and says the recommended fare has increased to 270 ₽.','Open the explanation to see why the recommendation changed.']},why:{file:'prototype-why.png',alt:'Explanation for the higher fare',ru:['Почему цена выше?','Рядом много заказов и мало свободных машин. Пассажир может принять рекомендацию или оставить свою цену.','Вернитесь к состоянию высокого спроса.'],en:['Why is the fare higher?','There are many ride requests and few available cars nearby. The passenger can accept the recommendation or keep their fare.','Return to the high-demand state.']}};let current='good';function render(key){current=key;const s=states[key],v=en?s.en:s.ru;img.src='../assets/img/taxi/'+s.file;img.alt=s.alt;title.textContent=v[0];desc.textContent=v[1];note.textContent=v[2];buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===key)));why.disabled=key==='why';why.textContent=key==='why'?(en?'Back to high demand':'Вернуться к высокому спросу'):(en?'Why did the fare increase?':'Почему цена выросла?')}buttons.forEach(b=>b.addEventListener('click',()=>render(b.dataset.state)));why.addEventListener('click',()=>render(current==='why'?'demand':'why'));render('good')})();
</script></body></html>
