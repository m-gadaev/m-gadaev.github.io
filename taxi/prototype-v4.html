<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lokali Taxi · интерактивный прототип</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent;font-family:Onest,Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center;overflow-x:hidden}
.stage{width:100%;min-height:790px;display:grid;place-items:center;padding:14px 10px}
.phone{position:relative;width:min(100%,360px);height:min(780px,calc(100vh - 24px));aspect-ratio:375/812;border:8px solid #09090b;border-radius:46px;background:#09090b;overflow:hidden;box-shadow:0 22px 65px #0005}
.screen{position:absolute;inset:0;border-radius:36px;overflow:hidden;background:#f2f2f2}
.map-screen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.status{position:absolute;z-index:2;top:0;left:0;right:0;height:43px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#111;font-size:12px;font-weight:650;pointer-events:none}
.island{position:absolute;z-index:3;top:9px;left:50%;transform:translateX(-50%);width:82px;height:22px;border-radius:16px;background:#080808;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.22);z-index:4;transition:opacity .22s}
.sheet{position:absolute;z-index:5;left:0;right:0;top:32px;bottom:0;border-radius:24px 24px 0 0;background:#fff;color:#171717;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 28px #00000012}
.grabber{width:56px;height:4px;border-radius:8px;background:#171717;margin:8px auto 0;flex:0 0 auto}
.sheet-head{height:48px;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.sheet-title{font-size:18px;font-weight:550;letter-spacing:-.02em}
.close{position:absolute;right:14px;top:8px;width:28px;height:28px;border:0;border-radius:50%;background:#f1f1f1;color:#777;font-size:21px;line-height:1;cursor:pointer}
.amount-area{height:88px;display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:1px solid #ededed;position:relative;flex:0 0 auto;padding:0 16px}
.amount{font-size:46px;line-height:1;font-weight:400;letter-spacing:-.04em;min-width:90px;text-align:center;color:#171717;font-variant-numeric:tabular-nums}
.currency{font-size:42px;color:#777;font-weight:350;margin-left:-10px}
.stepper{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:50%;background:#f1f2f3;color:#171717;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.stepper:active{background:#e2e3e5;transform:scale(.96)}
.hint{min-height:34px;display:flex;align-items:center;justify-content:center;padding:4px 12px;font-size:12px;color:#15934f;text-align:center;flex:0 0 auto}
.hint.error{color:#e24a4a}
.payment{height:52px;margin:0 16px 8px;border:1px solid #e9e9e9;border-radius:12px;background:#f4f5f6;display:flex;align-items:center;padding:0 16px;gap:12px;font-size:14px;flex:0 0 auto}
.ruble{color:#777;font-size:17px}.payment-label{flex:1}.chevron{font-size:22px;color:#888}
.done{height:48px;margin:0 16px 14px;border:0;border-radius:12px;background:#ffbd00;color:#171717;font:600 14px inherit;cursor:pointer;flex:0 0 auto}
.done:disabled{background:#ececee;color:#a6a6a8;cursor:default}
.keyboard{height:289px;flex:0 0 289px;background:#d1d3d9;padding:0 6px 0;display:flex;flex-direction:column;overflow:hidden}
.autocorrection{height:45px;flex:0 0 45px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 6px}
.key-rows{display:flex;flex-direction:column;gap:7px;padding:0 0 5px}
.key-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{height:46px;border:0;border-radius:4.6px;background:#fff;color:#080808;box-shadow:0 1px 1px #0003;font:400 25px/28px Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;padding:0}
.key:active{background:#f1f1f1;transform:translateY(1px)}
.key small{font:700 9px/10px Inter,system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;margin-top:0}
.key-zero-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key-zero-row .key{grid-column:2}
.key.delete{font-size:18px}
.keyboard-home{height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:center;background:#d1d3d9}
.keyboard-home span{width:108px;height:4px;border-radius:6px;background:#858585}
.phone.closed .sheet{transform:translateY(105%)}
.phone.closed .scrim{opacity:0;pointer-events:none}
.main-hotspot{position:absolute;z-index:3;left:0;right:0;bottom:0;height:58%;display:none;cursor:pointer}
.phone.closed .main-hotspot{display:block}
@media(max-width:520px){.stage{min-height:100svh;padding:0}.phone{width:min(100vw,430px);height:100svh;max-height:900px;border-width:0;border-radius:0;aspect-ratio:auto}.screen{border-radius:0}.sheet{top:32px;border-radius:24px 24px 0 0}}
@media(min-width:521px){.phone{width:min(360px,calc((100vh - 24px)*.462));height:min(780px,calc(100vh - 24px));}.stage{min-height:790px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<main class="stage"><div class="phone" id="phone"><div class="screen">
<img class="map-screen" src="../assets/img/taxi/prototype-main-map.png" alt="Главный экран Lokali Taxi с маршрутом">
<div class="status"><span>9:41</span><span>▮▮ ◧</span></div><span class="island" aria-hidden="true"></span>
<div class="scrim" id="scrim"></div><div class="main-hotspot" id="reopen" role="button" tabindex="0" aria-label="Открыть редактирование цены"></div>
<section class="sheet" aria-label="Укажите вашу цену">
<div class="grabber"></div><header class="sheet-head"><div class="sheet-title">Укажите вашу цену</div><button class="close" id="close" aria-label="Закрыть">×</button></header>
<div class="amount-area">
<button class="stepper" id="minus" type="button" aria-label="Уменьшить цену">−</button>
<span class="amount" id="amount">450</span><span class="currency">₽</span>
<button class="stepper" id="plus" type="button" aria-label="Увеличить цену">+</button>
</div>
<div class="hint" id="hint" aria-live="polite">Хорошая цена — водители откликнутся быстрее</div>
<div class="payment"><span class="ruble">₽</span><span class="payment-label">Оплата наличными</span><span class="chevron">›</span></div>
<button class="done" id="done" type="button">Готово</button>
<div class="keyboard" aria-label="Цифровая клавиатура">
<div class="autocorrection"><span></span><span></span><span></span></div>
<div class="key-rows">
<div class="key-row"><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2<small>АБВГ</small></button><button class="key" data-digit="3">3<small>ДЕЖЗ</small></button></div>
<div class="key-row"><button class="key" data-digit="4">4<small>ИЙКЛ</small></button><button class="key" data-digit="5">5<small>МНОП</small></button><button class="key" data-digit="6">6<small>РСТУ</small></button></div>
<div class="key-row"><button class="key" data-digit="7">7<small>ФХЦЧ</small></button><button class="key" data-digit="8">8<small>ШЩЪЫ</small></button><button class="key" data-digit="9">9<small>ЬЭЮЯ</small></button></div>
<div class="key-zero-row"><button class="key" data-digit="0">0</button></div>
</div></div><div class="keyboard-home"><span></span></div>
</section></div></div></main>
<script>
(()=>{const phone=document.getElementById('phone'),amount=document.getElementById('amount'),hint=document.getElementById('hint'),done=document.getElementById('done');let value=450,lastValue=450,editing=false;
function render(){amount.textContent=value.toLocaleString('ru-RU');hint.classList.remove('error');if(value>9999){hint.textContent='Максимальная цена — 9 999 ₽';hint.classList.add('error');done.disabled=true}else if(value<450){hint.textContent='Не ниже рекомендованной цены — 450 ₽';hint.classList.add('error');done.disabled=true}else{hint.textContent='Хорошая цена — водители откликнутся быстрее';done.disabled=false}}
function setValue(n){value=Math.max(0,Math.min(99999,n));render()}
document.getElementById('minus').addEventListener('click',()=>setValue(value-30));
document.getElementById('plus').addEventListener('click',()=>setValue(value+30));
document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>{if(!editing){value=0;editing=true}setValue(Number(String(value)+b.dataset.digit))}));
amount.addEventListener('click',()=>{value=0;editing=true;render()});
document.addEventListener('keydown',e=>{if(phone.classList.contains('closed'))return;if(/^[0-9]$/.test(e.key)){if(!editing){value=0;editing=true}setValue(Number(String(value)+e.key))}if(e.key==='Backspace')setValue(Math.floor(value/10));if(e.key==='Enter'&&!done.disabled)finish()});
function finish(){if(done.disabled)return;lastValue=value;phone.classList.add('closed')}
done.addEventListener('click',finish);
document.getElementById('close').addEventListener('click',()=>{lastValue=value;phone.classList.add('closed')});
function reopen(){value=lastValue;editing=false;phone.classList.remove('closed');render()}
document.getElementById('reopen').addEventListener('click',reopen);
document.getElementById('reopen').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reopen()}});
render();
})();
</script></body></html>
